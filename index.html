function getGuitarHeroHtml() {
    return `
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #0f0f1a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { width: 100vw; max-width: 400px; height: 100vh; position: relative; background: #1a1a2e; overflow: hidden; }
        .header { display: flex; justify-content: space-between; padding: 15px; font-size: 14px; color: #a0a0b0; border-bottom: 1px solid #2a2a4a; }
        .score { font-size: 20px; color: #fff; font-weight: bold; }
        canvas { display: block; width: 100%; height: calc(100% - 100px); }
        .controls { display: flex; height: 100px; background: #12121f; border-top: 1px solid #2a2a4a; }
        .btn { flex: 1; border: none; border-right: 1px solid #2a2a4a; background: transparent; color: white; font-size: 24px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: background 0.1s; }
        .btn:active { background: #2a2a4a; }
        .btn:nth-child(1) { box-shadow: inset 0 -4px 0 #ff3366; }
        .btn:nth-child(2) { box-shadow: inset 0 -4px 0 #33ccff; }
        .btn:nth-child(3) { box-shadow: inset 0 -4px 0 #cc33ff; }
        .btn:nth-child(4) { box-shadow: inset 0 -4px 0 #ffcc00; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 26, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        h1 { margin-bottom: 20px; color: #ff3366; text-shadow: 0 0 10px #ff3366; }
        .start-btn { padding: 15px 40px; font-size: 18px; background: #ff3366; color: white; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4); }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-screen">
            <h1>GUITAR HERO</h1>
            <p style="margin-bottom: 20px; color: #a0a0b0;">Ketuk tombol saat not menyentuh garis!</p>
            <button class="start-btn" onclick="startGame()">START ROCKING</button>
        </div>
        <div class="header">
            <div>COMBO <span id="combo" style="color:#ffcc00">0</span></div>
            <div class="score" id="score">000000</div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <button class="btn" ontouchstart="tapLane(0)" onmousedown="tapLane(0)">●</button>
            <button class="btn" ontouchstart="tapLane(1)" onmousedown="tapLane(1)">●</button>
            <button class="btn" ontouchstart="tapLane(2)" onmousedown="tapLane(2)">●</button>
            <button class="btn" ontouchstart="tapLane(3)" onmousedown="tapLane(3)">●</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let score = 0;
        let combo = 0;
        let notes = [];
        let lanes = 4;
        let laneWidth;
        let isPlaying = false;
        let spawnTimer = 0;
        let gameSpeed = 4;
        let hitLineY;
        const colors = ['#ff3366', '#33ccff', '#cc33ff', '#ffcc00'];

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            laneWidth = canvas.width / lanes;
            hitLineY = canvas.height - 50;
        }
        window.addEventListener('resize', resize);

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            resize();
            score = 0; combo = 0; notes = []; isPlaying = true;
            document.getElementById('score').innerText = '000000';
            document.getElementById('combo').innerText = '0';
            gameLoop();
        }

        function spawnNote() {
            const lane = Math.floor(Math.random() * lanes);
            notes.push({
                lane: lane,
                y: -30,
                speed: gameSpeed + (score / 2000), // Makin lama makin cepat
                color: colors[lane]
            });
        }

        function tapLane(lane) {
            if (!isPlaying) return;
            let hit = false;
            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                // Hit area tolerance
                if (note.lane === lane && note.y > hitLineY - 40 && note.y < hitLineY + 40) {
                    notes.splice(i, 1);
                    score += 100 + (combo * 10);
                    combo++;
                    hit = true;
                    document.getElementById('score').innerText = String(score).padStart(6, '0');
                    document.getElementById('combo').innerText = combo;
                    break;
                }
            }
            if (!hit) {
                combo = 0;
                document.getElementById('combo').innerText = combo;
            }
        }

        function gameLoop() {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Lanes
            for (let i = 1; i < lanes; i++) {
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, canvas.height);
                ctx.strokeStyle = '#2a2a4a';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Draw Hit Line
            ctx.beginPath();
            ctx.moveTo(0, hitLineY);
            ctx.lineTo(canvas.width, hitLineY);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Spawn Notes
            spawnTimer++;
            if (spawnTimer > 40) { // Spawn rate
                spawnNote();
                spawnTimer = 0;
            }

            // Update & Draw Notes
            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                note.y += note.speed;

                // Draw Note
                ctx.beginPath();
                ctx.roundRect((note.lane * laneWidth) + (laneWidth/4), note.y, laneWidth/2, 20, 10);
                ctx.fillStyle = note.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = note.color;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Missed Note
                if (note.y > canvas.height) {
                    notes.splice(i, 1);
                    combo = 0;
                    document.getElementById('combo').innerText = combo;
                }
            }

            requestAnimationFrame(gameLoop);
        }
        
        // Polyfill for roundRect if not supported
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }
    </script>
</body>
</html>
    `;
}

module.exports = { getGuitarHeroHtml };
