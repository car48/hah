<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔍 Social Tracke Caryz</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ========== GLOBAL ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 20% 30%, #141b2b, #0a0f1a);
      padding: 20px;
      position: relative;
    }

    /* Efek bintang */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.15), transparent),
                        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.1), transparent),
                        radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.2), transparent),
                        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.1), transparent),
                        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.15), transparent);
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 56px;
      padding: 44px 38px;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 30px 60px -12px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.02);
      transition: 0.3s;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      color: #f0f6ff;
      text-align: center;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    h1 i {
      color: #4f9fff;
      font-size: 34px;
      filter: drop-shadow(0 0 12px rgba(79,159,255,0.3));
    }

    .sub {
      text-align: center;
      color: #9aafd0;
      font-size: 15px;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding-bottom: 18px;
      letter-spacing: 0.2px;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 32px;
    }
    .input-group input {
      flex: 1;
      min-width: 180px;
      padding: 18px 24px;
      border: none;
      border-radius: 80px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
      color: #eef3ff;
      font-size: 17px;
      outline: 2px solid transparent;
      transition: 0.3s;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
    }
    .input-group input::placeholder {
      color: #6f82aa;
      font-weight: 400;
      letter-spacing: 0.3px;
    }
    .input-group input:focus {
      outline: 2px solid #4f9fff;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 20px rgba(79,159,255,0.15);
    }
    .input-group button {
      padding: 18px 38px;
      border: none;
      border-radius: 80px;
      background: linear-gradient(135deg, #4f9fff, #7c5cfc);
      color: #fff;
      font-weight: 600;
      font-size: 17px;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 8px 28px rgba(79,159,255,0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }
    .input-group button:hover:not(:disabled) {
      transform: scale(1.03);
      box-shadow: 0 12px 40px rgba(79,159,255,0.5);
    }
    .input-group button:active:not(:disabled) {
      transform: scale(0.95);
    }
    .input-group button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .input-group button i {
      font-size: 18px;
    }

    /* ===== LOADING ===== */
    .loader {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px 0 16px;
    }
    .loader .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,0.06);
      border-top: 4px solid #4f9fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader .status-text {
      color: #b8caf0;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.4px;
      background: rgba(0,0,0,0.2);
      padding: 8px 24px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.03);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }
    .loader .status-text i {
      margin-right: 10px;
      color: #4f9fff;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ===== HASIL ===== */
    .results {
      display: none;
      margin-top: 24px;
      animation: fadeUp 0.6s ease;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 20px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: 0.25s;
      cursor: default;
    }
    .result-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(6px);
      border-color: rgba(79,159,255,0.15);
    }
    .result-item .icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: rgba(255,255,255,0.03);
      flex-shrink: 0;
    }
    .result-item .info {
      flex: 1;
    }
    .result-item .platform {
      font-weight: 600;
      color: #e4ecff;
      font-size: 16px;
    }
    .result-item .username {
      color: #9aafd9;
      font-size: 15px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.2px;
      margin-top: 2px;
    }
    .result-item .username i {
      font-size: 13px;
      margin-right: 6px;
      color: #6c8bc0;
    }
    .result-item .last-online {
      font-size: 13px;
      color: #7a8fb0;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-item .last-online i {
      font-size: 12px;
      color: #4f9fff;
    }
    .result-item .last-online .online-now {
      color: #4ade80;
      font-weight: 500;
    }

    /* Warna ikon platform */
    .icon-instagram { color: #E4405F; }
    .icon-facebook { color: #1877F2; }
    .icon-telegram { color: #26A5E4; }
    .icon-twitter { color: #1DA1F2; }
    .icon-tiktok { color: #000; background: #fff; border-radius: 10px; }
    .icon-snapchat { color: #FFFC00; }
    .icon-discord { color: #5865F2; }

    /* Footer */
    .footer {
      margin-top: 32px;
      text-align: center;
      color: #4f6a99;
      font-size: 13px;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 22px;
      letter-spacing: 0.3px;
    }
    .footer i {
      color: #4f9fff;
      margin: 0 4px;
    }

    @media (max-width: 500px) {
      .card { padding: 30px 18px; }
      .input-group button { padding: 16px 22px; font-size: 15px; }
      .result-item { padding: 12px 14px; }
      .result-item .icon { width: 40px; height: 40px; font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="card">

  <h1>
    <i class="fas fa-user-secret"></i>  Media Social Stalking 😁🤙🏻
  </h1>
  <div class="sub">🔍 Anjingna Nomor untuk mengetahui akun media sosial e ya kirik

  <div class="input-group">
    <input type="tel" id="phoneInput" placeholder="NDI NOMERE NYET " />
    <button id="searchBtn">
      <i class="fas fa-search"></i> Lacak
    </button>
  </div>

  <!-- Loading -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="status-text" id="statusText">
      <i class="fas fa-circle-notch fa-fw"></i> Menghubungi server...
    </div>
  </div>

  <!-- Hasil -->
  <div class="results" id="results"></div>

  <div class="footer">
    <i class="fas fa-shield-alt"></i> ASCII.SQL.Caryz.Nexus 👁️👄👁️
  </div>
</div>

<script>
  (function() {
    // ---------- Daftar platform (tanpa WhatsApp, tanpa YouTube) ----------
    const PLATFORMS = [
      { name: 'Instagram', icon: 'fab fa-instagram', cssClass: 'icon-instagram' },
      { name: 'Facebook', icon: 'fab fa-facebook', cssClass: 'icon-facebook' },
      { name: 'Twitter / X', icon: 'fab fa-twitter', cssClass: 'icon-twitter' },
      { name: 'Telegram', icon: 'fab fa-telegram-plane', cssClass: 'icon-telegram' },
      { name: 'TikTok', icon: 'fab fa-tiktok', cssClass: 'icon-tiktok' },
      { name: 'Snapchat', icon: 'fab fa-snapchat-ghost', cssClass: 'icon-snapchat' },
      { name: 'Discord', icon: 'fab fa-discord', cssClass: 'icon-discord' }
    ];

    // ---------- Daftar waktu "Terakhir online" yang realistis ----------
    const LAST_ONLINE_OPTIONS = [
      { label: 'Online sekarang', class: 'online-now', icon: 'fa-circle' },
      { label: '5 menit lalu', class: '', icon: 'fa-clock' },
      { label: '15 menit lalu', class: '', icon: 'fa-clock' },
      { label: '1 jam lalu', class: '', icon: 'fa-clock' },
      { label: '2 jam lalu', class: '', icon: 'fa-clock' },
      { label: 'Hari ini 08:30', class: '', icon: 'fa-calendar-day' },
      { label: 'Hari ini 12:45', class: '', icon: 'fa-calendar-day' },
      { label: 'Hari ini 16:20', class: '', icon: 'fa-calendar-day' },
      { label: 'Kemarin 19:10', class: '', icon: 'fa-calendar-alt' },
      { label: 'Kemarin 22:00', class: '', icon: 'fa-calendar-alt' },
      { label: '2 hari lalu', class: '', icon: 'fa-calendar-alt' },
      { label: '3 hari lalu', class: '', icon: 'fa-calendar-alt' },
      { label: '5 hari lalu', class: '', icon: 'fa-calendar-alt' },
      { label: '1 minggu lalu', class: '', icon: 'fa-calendar-alt' }
    ];

    // ---------- Generate username berbasis "Metha" dengan gaya Gen Z ----------
    function generateUsername() {
      const base = 'Metha';
      const patterns = [
        () => base,
        () => base + Math.floor(Math.random() * 99 + 1),
        () => base + '_' + Math.floor(Math.random() * 99 + 1),
        () => base + '.' + Math.floor(Math.random() * 99 + 1),
        () => base + '_official',
        () => base + '_real',
        () => base.toLowerCase(),
        () => base.toLowerCase() + Math.floor(Math.random() * 99 + 1),
        () => base + Math.floor(Math.random() * 900 + 100),
        () => 'its' + base,
        () => 'mrs' + base,
        () => 'iam' + base,
        () => base + 'xz',
        () => base + 'y',
        () => base + '_' + ['id', 'my', 'official', 'real', 'lover', 'girly'][Math.floor(Math.random() * 6)]
      ];
      return patterns[Math.floor(Math.random() * patterns.length)]();
    }

    // ---------- Pilih waktu online acak ----------
    function getRandomLastOnline() {
      return LAST_ONLINE_OPTIONS[Math.floor(Math.random() * LAST_ONLINE_OPTIONS.length)];
    }

    // ---------- Render hasil ----------
    function renderResults(platforms) {
      const container = document.getElementById('results');
      container.innerHTML = '';
      platforms.forEach(p => {
        const username = generateUsername();
        const lastOnline = getRandomLastOnline();
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <div class="icon ${p.cssClass}">
            <i class="${p.icon}"></i>
          </div>
          <div class="info">
            <div class="platform">${p.name}</div>
            <div class="username"><i class="fas fa-at"></i> ${username}</div>
            <div class="last-online">
              <i class="fas ${lastOnline.icon}"></i>
              <span class="${lastOnline.class}">${lastOnline.label}</span>
            </div>
          </div>
        `;
        container.appendChild(item);
      });
      container.style.display = 'block';
    }

    // ---------- Status loading (5 tahap) ----------
    const STATUS_STEPS = [
      { icon: 'fa-server', text: 'Mengakses server database...' },
      { icon: 'fa-phone-alt', text: 'Memeriksa nomor di pusat data...' },
      { icon: 'fa-user-friends', text: 'Mencari akun terhubung...' },
      { icon: 'fa-chart-line', text: 'Menganalisis profil media sosial...' },
      { icon: 'fa-check-circle', text: 'Selesai! Menyusun hasil...' }
    ];

    // ---------- Proses utama (durasi 6 detik) ----------
    function startSearch() {
      const input = document.getElementById('phoneInput');
      const phone = input.value.trim();

      if (!phone) {
        alert('📱 Masukkan nomor telepon dulu!');
        return;
      }

      const resultsDiv = document.getElementById('results');
      resultsDiv.style.display = 'none';
      const loader = document.getElementById('loader');
      loader.style.display = 'flex';
      const statusEl = document.getElementById('statusText');

      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Mencari...';

      let step = 0;
      const totalSteps = STATUS_STEPS.length;
      statusEl.innerHTML = `<i class="fas ${STATUS_STEPS[0].icon} fa-fw"></i> ${STATUS_STEPS[0].text}`;

      const interval = setInterval(() => {
        step++;
        if (step < totalSteps) {
          statusEl.innerHTML = `<i class="fas ${STATUS_STEPS[step].icon} fa-fw"></i> ${STATUS_STEPS[step].text}`;
        }
      }, 1200);

      setTimeout(() => {
        clearInterval(interval);
        loader.style.display = 'none';
        renderResults(PLATFORMS);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-search"></i> Lacak';
      }, 6000);
    }

    // ---------- Event binding ----------
    document.getElementById('searchBtn').addEventListener('click', startSearch);
    document.getElementById('phoneInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        startSearch();
      }
    });

  })();
</script>
</body>
</html>
