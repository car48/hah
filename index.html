<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔍 Social Tracker Pro</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ========== GLOBAL ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 20% 30%, #141b2b, #0a0f1a);
      padding: 20px;
      position: relative;
    }

    /* Efek bintang kecil (dekorasi) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.15), transparent),
                        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.1), transparent),
                        radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.2), transparent),
                        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.1), transparent),
                        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.15), transparent);
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 56px;
      padding: 44px 38px;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 30px 60px -12px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.02);
      transition: 0.3s;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      color: #f0f6ff;
      text-align: center;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    h1 i {
      color: #4f9fff;
      font-size: 34px;
      filter: drop-shadow(0 0 12px rgba(79,159,255,0.3));
    }

    .sub {
      text-align: center;
      color: #9aafd0;
      font-size: 15px;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding-bottom: 18px;
      letter-spacing: 0.2px;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 32px;
    }
    .input-group input {
      flex: 1;
      min-width: 180px;
      padding: 18px 24px;
      border: none;
      border-radius: 80px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
      color: #eef3ff;
      font-size: 17px;
      outline: 2px solid transparent;
      transition: 0.3s;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
    }
    .input-group input::placeholder {
      color: #6f82aa;
      font-weight: 400;
      letter-spacing: 0.3px;
    }
    .input-group input:focus {
      outline: 2px solid #4f9fff;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 20px rgba(79,159,255,0.15);
    }
    .input-group button {
      padding: 18px 38px;
      border: none;
      border-radius: 80px;
      background: linear-gradient(135deg, #4f9fff, #7c5cfc);
      color: #fff;
      font-weight: 600;
      font-size: 17px;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 8px 28px rgba(79,159,255,0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }
    .input-group button:hover:not(:disabled) {
      transform: scale(1.03);
      box-shadow: 0 12px 40px rgba(79,159,255,0.5);
    }
    .input-group button:active:not(:disabled) {
      transform: scale(0.95);
    }
    .input-group button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .input-group button i {
      font-size: 18px;
    }

    /* ===== LOADING (dengan status teks) ===== */
    .loader {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px 0 16px;
    }
    .loader .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,0.06);
      border-top: 4px solid #4f9fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader .status-text {
      color: #b8caf0;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.4px;
      background: rgba(0,0,0,0.2);
      padding: 8px 24px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.03);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }
    .loader .status-text i {
      margin-right: 10px;
      color: #4f9fff;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ===== HASIL ===== */
    .results {
      display: none;
      margin-top: 24px;
      animation: fadeUp 0.6s ease;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 20px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: 0.25s;
      cursor: default;
    }
    .result-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(6px);
      border-color: rgba(79,159,255,0.15);
    }
    .result-item .icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: rgba(255,255,255,0.03);
      flex-shrink: 0;
    }
    .result-item .info {
      flex: 1;
    }
    .result-item .platform {
      font-weight: 600;
      color: #e4ecff;
      font-size: 16px;
    }
    .result-item .username {
      color: #9aafd9;
      font-size: 15px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.2px;
      margin-top: 2px;
    }
    .result-item .username i {
      font-size: 13px;
      margin-right: 6px;
      color: #6c8bc0;
    }

    /* Warna ikon platform */
    .icon-instagram { color: #E4405F; }
    .icon-facebook { color: #1877F2; }
    .icon-telegram { color: #26A5E4; }
    .icon-twitter { color: #1DA1F2; }
    .icon-tiktok { color: #000; background: #fff; border-radius: 10px; }
    .icon-whatsapp { color: #25D366; }
    .icon-youtube { color: #FF0000; }
    .icon-snapchat { color: #FFFC00; }
    .icon-discord { color: #5865F2; }

    /* Footer */
    .footer {
      margin-top: 32px;
      text-align: center;
      color: #4f6a99;
      font-size: 13px;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 22px;
      letter-spacing: 0.3px;
    }
    .footer i {
      color: #4f9fff;
      margin: 0 4px;
    }

    @media (max-width: 500px) {
      .card { padding: 30px 18px; }
      .input-group button { padding: 16px 22px; font-size: 15px; }
      .result-item { padding: 12px 14px; }
      .result-item .icon { width: 40px; height: 40px; font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="card">

  <h1>
    <i class="fas fa-user-secret"></i> Social Caryz Tracker
  </h1>
  <div class="sub">🔍 Masukkan nomor untuk mencari akun media sosial </div>

  <div class="input-group">
    <input type="tel" id="phoneInput" placeholder="+62 812 3456 7890" />
    <button id="searchBtn">
      <i class="fas fa-search"></i> Lacak
    </button>
  </div>

  <!-- Loading dengan status berubah -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="status-text" id="statusText">
      <i class="fas fa-circle-notch fa-fw"></i> Menghubungi server...
    </div>
  </div>

  <!-- Hasil -->
  <div class="results" id="results"></div>

  <div class="footer">
    <i class="fas fa-shield-alt"></i> kirikkkk🗿🤙🏻
  </div>
</div>

<script>
  (function() {
    // ---------- Daftar platform (tanpa Free Fire) ----------
    const PLATFORMS = [
      { name: 'Instagram', icon: 'fab fa-instagram', cssClass: 'icon-instagram' },
      { name: 'Facebook', icon: 'fab fa-facebook', cssClass: 'icon-facebook' },
      { name: 'Telegram', icon: 'fab fa-telegram-plane', cssClass: 'icon-telegram' },
      { name: 'Twitter / X', icon: 'fab fa-twitter', cssClass: 'icon-twitter' },
      { name: 'TikTok', icon: 'fab fa-tiktok', cssClass: 'icon-tiktok' },
      { name: 'WhatsApp', icon: 'fab fa-whatsapp', cssClass: 'icon-whatsapp' },
      { name: 'YouTube', icon: 'fab fa-youtube', cssClass: 'icon-youtube' },
      { name: 'Snapchat', icon: 'fab fa-snapchat-ghost', cssClass: 'icon-snapchat' },
      { name: 'Discord', icon: 'fab fa-discord', cssClass: 'icon-discord' }
    ];

    // ---------- Nama perempuan Indonesia (25) ----------
    const NAMES = [
      'Amel'
    ];

    // ---------- Generate username mirip nama perempuan ----------
    function generateUsername() {
      const name = NAMES[Math.floor(Math.random() * NAMES.length)];
      const patterns = [
        () => name,
        () => name + Math.floor(Math.random() * 99 + 1),
        () => name + '_' + Math.floor(Math.random() * 99 + 1),
        () => name + '.' + Math.floor(Math.random() * 99 + 1),
        () => name + '_official',
        () => name + '_real',
        () => name.toLowerCase(),
        () => name.toLowerCase() + Math.floor(Math.random() * 99 + 1),
        () => name + Math.floor(Math.random() * 900 + 100)
      ];
      return patterns[Math.floor(Math.random() * patterns.length)]();
    }

    // ---------- Render hasil ----------
    function renderResults(platforms) {
      const container = document.getElementById('results');
      container.innerHTML = '';
      platforms.forEach(p => {
        const username = generateUsername();
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <div class="icon ${p.cssClass}">
            <i class="${p.icon}"></i>
          </div>
          <div class="info">
            <div class="platform">${p.name}</div>
            <div class="username"><i class="fas fa-at"></i> ${username}</div>
          </div>
        `;
        container.appendChild(item);
      });
      container.style.display = 'block';
    }

    // ---------- Status loading (5 tahap) ----------
    const STATUS_STEPS = [
      { icon: 'fa-server', text: 'Mengakses server database...' },
      { icon: 'fa-phone-alt', text: 'Memeriksa nomor di pusat data...' },
      { icon: 'fa-user-friends', text: 'Mencari akun terhubung...' },
      { icon: 'fa-chart-line', text: 'Menganalisis profil media sosial...' },
      { icon: 'fa-check-circle', text: 'Selesai! Menyusun hasil...' }
    ];

    // ---------- Proses utama (durasi 6 detik) ----------
    function startSearch() {
      const input = document.getElementById('phoneInput');
      const phone = input.value.trim();

      if (!phone) {
        alert('📱 Masukkan nomor telepon dulu!');
        return;
      }

      // Sembunyikan hasil, tampilkan loading
      const resultsDiv = document.getElementById('results');
      resultsDiv.style.display = 'none';
      const loader = document.getElementById('loader');
      loader.style.display = 'flex';
      const statusEl = document.getElementById('statusText');

      // Nonaktifkan tombol
      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Mencari...';

      // Mulai step status
      let step = 0;
      const totalSteps = STATUS_STEPS.length;
      // Tampilkan step pertama langsung
      statusEl.innerHTML = `<i class="fas ${STATUS_STEPS[0].icon} fa-fw"></i> ${STATUS_STEPS[0].text}`;

      // Interval setiap 1.2 detik (total 5 step = 6 detik)
      const interval = setInterval(() => {
        step++;
        if (step < totalSteps) {
          statusEl.innerHTML = `<i class="fas ${STATUS_STEPS[step].icon} fa-fw"></i> ${STATUS_STEPS[step].text}`;
        }
      }, 1200);

      // Setelah 6 detik (5 step * 1.2s = 6000ms)
      setTimeout(() => {
        clearInterval(interval);
        loader.style.display = 'none';
        renderResults(PLATFORMS);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-search"></i> Lacak';
      }, 6000);
    }

    // ---------- Event binding ----------
    document.getElementById('searchBtn').addEventListener('click', startSearch);
    document.getElementById('phoneInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        startSearch();
      }
    });

  })();
</script>
</body>
</html>
